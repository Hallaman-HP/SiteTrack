; SiteTrack API — raise memory limit above the default 128M
; The /api/store response can materialise many asset_photos.photo_url data URLs
; (base64) in one PHP array; 128M OOMs. Raised to 512M as a safety net.
memory_limit = 512M

; Upload/POST size limits — asset save embeds a base64 photo_url in the JSON
; body. Client-side compression targets 200 KB (~270 KB base64), but leave
; generous headroom for older phones and edge cases.
post_max_size = 12M
upload_max_filesize = 10M
